<script>
const app=document.getElementById('app');
let currentPage='home';
let quizScore=0;
let quizIndex=0;

 {name:'Java Programming',icon:'☕',progress:82,level:'Strong'},
 {name:'Data Structures',icon:'🌳',progress:71,level:'Improve'},

function toast(msg){
 const t=document.getElementById('toast');
 t.innerHTML=`<div class="toast bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl font-medium">${msg}</div>`;
 t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),3000);
}

function showPage(page){
 currentPage=page; window.scrollTo({top:0,behavior:'smooth'});
 const pages={home:home,dashboard:dashboard,tutor:tutor,planner:planner,resources:resources,progress:progress,quiz:quiz,notes:notes,exam:exam,profile:profile};
 app.innerHTML=(pages[page]||home)(); app.classList.remove('fade'); void app.offsetWidth; app.classList.add('fade');
 if(page==='progress') setTimeout(drawChart,80);
 if(page==='quiz') renderQuestion();
}

<div class="p-4 border-t border-slate-200 flex gap-2"><input id="question" class="input flex-1 border rounded-xl p-3" placeholder="Ask: Explain binary search in simple words..."><button onclick="sendAI()" class="px-5 rounded-xl bg-indigo-600 text-white font-bold">Send</button></div>
</div></div>
`)}

function askAI(type){document.getElementById('question').value=type+' about Data Structures';sendAI();}
function sendAI(){
const input=document.getElementById('question'), chat=document.getElementById('chat'); if(!input.value.trim())return;
const q=input.value.trim(); chat.innerHTML+=`<div class="ml-auto max-w-xl bg-indigo-600 text-white rounded-2xl rounded-tr-sm p-4"><p class="text-sm">${q}</p></div>`;
let a='A simple way to understand this is to break the concept into smaller steps. First learn the basic idea, then see an example, and finally practice a few questions. In a real deployment, this interface can be connected to an AI API for live personalized responses.';
if(q.toLowerCase().includes('binary'))a='<b>Binary Search</b> finds an item in a sorted list by repeatedly checking the middle element and eliminating half of the remaining search space. Its time complexity is <b>O(log n)</b>.';
if(q.toLowerCase().includes('quiz'))a='<b>Quick quiz:</b> What is the time complexity of binary search on a sorted array? <br><br>A) O(n) &nbsp; B) O(log n) &nbsp; C) O(n²)';
if(q.toLowerCase().includes('exam'))a='<b>Exam-ready structure:</b><br>1. Definition<br>2. Working principle<br>3. Algorithm/steps<br>4. Example<br>5. Complexity<br>6. Applications';
setTimeout(()=>{chat.innerHTML+=`<div class="max-w-xl bg-white rounded-2xl rounded-tl-sm p-4 shadow-sm"><b>AI Tutor</b><p class="mt-1 text-sm leading-6">${a}</p></div>`;chat.scrollTop=chat.scrollHeight},350);
input.value='';
}

function generatePlan(){

const questions=[
['Which data structure follows LIFO?',['Queue','Stack','Tree','Graph'],1],
['What is the average time complexity of binary search?',['O(n)','O(log n)','O(n²)','O(1)'],1],
['Which keyword creates a class in Java?',['function','define','class','object'],2],
['Which field helps an AI system decide what to do next?',['Perception','Action selection','Storage only','Display'],1]

function quiz(){return shell('Smart Quiz','Test yourself and get instant performance insights.',`
<div class="max-w-3xl mx-auto"><div class="surface bg-white border border-slate-200 rounded-3xl p-7">
<div class="flex justify-between text-sm font-bold"><span>Adaptive Quiz</span><span id="qProgress">Question 1 of ${questions.length}</span></div><div class="h-2 bg-slate-100 rounded-full mt-4"><div id="qBar" class="h-2 bg-indigo-500 rounded-full" style="width:25%"></div></div>
<div id="questionBox" class="mt-8"></div></div></div>`)}

function renderQuestion(){
const q=questions[quizIndex],box=document.getElementById('questionBox'); if(!box)return;
document.getElementById('qProgress').textContent=`Question ${quizIndex+1} of ${questions.length}`;
document.getElementById('qBar').style.width=((quizIndex+1)/questions.length*100)+'%';
box.innerHTML=`<h2 class="text-2xl font-black">${q[0]}</h2><div class="grid gap-3 mt-6">${q[1].map((a,i)=>`<button onclick="answer(${i})" class="answer text-left p-4 border border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 font-semibold">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div>`;
}
function answer(i){
const q=questions[quizIndex];document.querySelectorAll('.answer').forEach(b=>b.disabled=true);
if(i===q[2]){quizScore++;toast('Correct! 🎉')}else toast('Not quite — keep learning!');
setTimeout(()=>{quizIndex++;if(quizIndex<questions.length)renderQuestion();else{document.getElementById('questionBox').innerHTML=`<div class="text-center py-8"><div class="text-6xl">🏆</div><h2 class="text-3xl font-black mt-4">Quiz complete!</h2><p class="text-slate-500 mt-2">You scored ${quizScore}/${questions.length} (${Math.round(quizScore/questions.length*100)}%).</p><button onclick="quizIndex=0;quizScore=0;showPage('quiz')" class="mt-6 px-5 py-3 rounded-xl bg-indigo-600 text-white font-bold">Try Again</button><button onclick="showPage('progress')" class="ml-2 px-5 py-3 rounded-xl border font-bold">View Insights</button></div>`}},400);
}

function progress(){return shell('My Insights','Understand your learning patterns and focus where it matters.',`
<div class="grid lg:grid-cols-3 gap-5">
<div class="surface bg-white border border-slate-200 rounded-2xl p-6 lg:col-span-2"><h3 class="font-bold text-xl">Weekly Study Activity</h3><canvas id="chart" class="mt-5"></canvas></div>
<div class="surface bg-white border border-slate-200 rounded-2xl p-6"><h3 class="font-bold text-xl">Learning Score</h3><div class="text-6xl font-black text-indigo-600 mt-5">78</div><p class="text-sm text-slate-500 mt-1">Overall progress</p><div class="mt-6 space-y-4">${[['Java','82%'],['DSA','71%'],['Maths','65%'],['AI','88%']].map(x=>`<div><div class="flex justify-between text-sm"><b>${x[0]}</b><span>${x[1]}</span></div><div class="h-2 bg-slate-100 rounded mt-2"><div class="h-2 bg-indigo-500 rounded" style="width:${x[1]}"></div></div></div>`).join('')}</div></div>
</div>
<div class="grid md:grid-cols-2 gap-5 mt-5"><div class="surface bg-white border border-slate-200 rounded-2xl p-6"><h3 class="font-bold text-xl">💪 Strong Areas</h3><p class="mt-4 text-emerald-600 font-semibold">Java Basics · AI Foundations · Arrays</p></div><div class="surface bg-white border border-slate-200 rounded-2xl p-6"><h3 class="font-bold text-xl">📈 Needs Improvement</h3><p class="mt-4 text-amber-600 font-semibold">Recursion · Trees · Vector Calculus</p><button onclick="showPage('planner')" class="mt-4 text-indigo-600 font-bold text-sm">Create improvement plan →</button></div></div>
`)}

function drawChart(){new Chart(document.getElementById('chart'),{type:'line',data:{labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],datasets:[{label:'Study hours',data:[1.5,2,1,2.5,1.5,3.5,2.5],tension:.35}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}

function notes(){return shell('Smart Notes','Organize your knowledge and turn notes into active learning.',`
<div class="grid lg:grid-cols-3 gap-5"><div class="lg:col-span-2 surface bg-white border border-slate-200 rounded-2xl p-6"><input id="noteTitle" class="input w-full text-xl font-bold border-0 outline-none" placeholder="Note title" value="Binary Search — Quick Revision"><textarea id="noteText" class="input w-full h-72 mt-4 border rounded-xl p-4" placeholder="Write your notes...">Binary search works on sorted data. Compare the target with the middle element and eliminate half of the search space.</textarea><div class="flex flex-wrap gap-2 mt-4"><button onclick="toast('Note saved ✓')" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-bold">Save Note</button><button onclick="toast('AI summary generated')" class="px-5 py-2.5 rounded-xl bg-cyan-100 text-cyan-800 font-bold">✨ Summarize</button><button onclick="toast('Practice questions generated')" class="px-5 py-2.5 rounded-xl bg-emerald-100 text-emerald-800 font-bold">Generate Questions</button></div></div><div class="surface bg-white border border-slate-200 rounded-2xl p-6"><h3 class="font-bold">Pinned Notes</h3>${['Java OOP','Binary Search','AI Agents','Maths Formulas'].map(x=>`<div class="mt-4 p-3 rounded-xl bg-slate-50 text-sm font-semibold">📌 ${x}</div>`).join('')}</div></div>`)}

function exam(){return shell('Exam Mode','Focused preparation based on time remaining, priority and weak areas.',`
<div class="surface bg-gradient-to-br from-slate-900 to-indigo-900 text-white rounded-3xl p-8"><p class="text-cyan-300 font-bold">EXAM COUNTDOWN</p><div class="text-6xl font-black mt-2">23 <span class="text-2xl">days</span></div><p class="opacity-70 mt-2">Stay consistent. Your plan is ready.</p><div class="grid sm:grid-cols-3 gap-4 mt-7">${[['⭐','Important Topics','18'],['📝','Mock Tests','6'],['⚠️','Weak Areas','3']].map(x=>`<div class="bg-white/10 rounded-2xl p-5"><span>${x[0]}</span><p class="text-sm opacity-70 mt-2">${x[1]}</p><b class="text-2xl">${x[2]}</b></div>`).join('')}</div></div>
<div class="grid md:grid-cols-2 gap-5 mt-5">${[['🎯','Priority Revision','Recursion, Trees and Vector Calculus','planner'],['🧪','Mock Test','25 adaptive questions','quiz'],['⚡','Last-Minute Revision','Concise definitions, formulas and key points','notes'],['🤖','Ask AI','Clear a difficult concept before the exam','tutor']].map(x=>`<button onclick="showPage('${x[3]}')" class="surface text-left bg-white border border-slate-200 rounded-2xl p-6 hover:shadow-lg"><span class="text-3xl">${x[0]}</span><h3 class="font-bold text-xl mt-4">${x[1]}</h3><p class="text-sm text-slate-500 muted mt-2">${x[2]}</p><span class="text-indigo-600 font-bold text-sm inline-block mt-4">Open →</span></button>`).join('')}</div>
`)}

<div class="max-w-3xl surface bg-white border border-slate-200 rounded-3xl p-7"><div class="flex items-center gap-5"><div class="w-20 h-20 rounded-full bg-gradient-to-br from-indigo-500 to-cyan-400 text-white grid place-items-center text-3xl font-black">AK</div><div><h2 class="text-2xl font-black">Alex Kumar</h2><p class="text-slate-500">B.Tech · Computer Science · 2nd Year</p></div></div><div class="grid sm:grid-cols-2 gap-4 mt-8">${[['Course','B.Tech — Computer Science'],['Year','2nd Year'],['Goal','Score above 90%'],['Preferred mode','Visual + Practice']].map(x=>`<div class="p-4 rounded-xl bg-slate-50"><p class="text-xs text-slate-500">${x[0]}</p><b>${x[1]}</b></div>`).join('')}</div><button onclick="toast('Profile preferences saved')" class="mt-6 px-5 py-3 rounded-xl bg-indigo-600 text-white font-bold">Save Preferences</button></div>

showPage('home');
</script>
